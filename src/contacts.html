<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-width: 220px; }
    </style>
</head>
<body>
<div class="d-flex">
    <nav class="bg-dark text-white sidebar flex-shrink-0 p-3">
        <h4>Меню</h4>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="main.html" class="nav-link text-white">Главная</a></li>
            <li><a href="catalog.html" class="nav-link text-white">Каталог</a></li>
            <li><a href="category.html" class="nav-link text-white">Категория</a></li>
            <li class="nav-item"><a href="contacts.html" class="nav-link active">Контакты</a></li>
        </ul>
    </nav>
    <main class="container py-5">
        <h1 class="mb-4 text-center">Контакты</h1>
        <div class="row">
            <div class="col-md-5">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Почта</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="message" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
            <div class="col-md-7">
                <h4>Наши контакты</h4>
                <p>Какой-то текст для наполнения страницы...</p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
